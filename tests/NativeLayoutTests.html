<!doctype html>
<meta charset="utf-8">
<title>Native layout tests</title>
<pre id="result">Running...</pre>
<iframe id="app" title="Test app" style="width: 1500px; height: 980px"></iframe>
<script>
async function run() {
  const result = document.querySelector('#result');
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  try {
    const response = await fetch('../mockups/index.html');
    if (!response.ok) throw new Error(`Could not load app: ${response.status}`);
    const html = await response.text();
    const bootstrap = `<base href="../mockups/"><script>
      localStorage.removeItem('looper.visualView');
      window.testListeners = {};
      window.testEvents = [];
      window.__JUCE__ = { backend: {
        addEventListener: (name, callback) => window.testListeners[name] = callback,
        emitEvent: (name, data) => window.testEvents.push([name, data])
      }};
    <\/script>`;
    const frame = document.querySelector('#app');
    const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    frame.srcdoc = html.replace('<head>', `<head>${bootstrap}`);
    await loaded;
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    const effect = (id, template, name, category) => ({
      id, template, name, category, loaded: false, bypassed: false, pluginName: '',
      channels: 0, knobs: ['A'], parameters: [], assignments: []
    });
    const state = {
      effects: [effect('e1', 'boost', 'Boost', 'Gain'), effect('e2', 'custom', 'Custom VST3', 'Custom')],
      deckIndex: 1, layers: [], pedalTemplates: [], boardPresets: [], boardPreset: '',
      levels: { input: 80, live: 70, loop: 85, output: 60 },
      footer: { input: 0, gate: -50, transpose: 0, doubler: 15, output: 0 },
      recordLabel: 'RECORD', status: 'EMPTY', bpm: 120, beats: 4, unit: 4, progress: 0,
      recording: false, playing: false, canStop: false, canClear: false, canSaveLoop: false,
      canLoadLoop: true, canEditLayers: false, metronome: true, layered: true, countIn: 0,
      loopBars: 0, settingsLocked: false, countingIn: false, canChangeInput: true, inputMode: 0,
      inputPeak: 0, duration: 0, tuner: false, tunerText: 'Off', tunerNote: '', tunerCents: 0,
      gate: false, doubler: false, error: '', deviceReady: false
    };
    win.testListeners['native-state'](state);
    const select = doc.querySelector('#visual-view');
    const setView = async value => {
      select.value = value;
      select.dispatchEvent(new win.Event('change', { bubbles: true }));
      await new Promise(resolve => setTimeout(resolve, 20));
    };
    assert(select.value === 'default' && doc.querySelectorAll('#pedals .pedal').length === 3, 'Default board');
    await setView('board-1');
    assert(doc.querySelectorAll('#pedals .study-mini').length === 2
      && doc.querySelectorAll('#pedals .looper').length === 1, 'Fixed deck');
    assert(doc.querySelector('[data-pedal="e2"] .gallery-pedal-name').textContent === 'Custom VST3', 'Custom VST artwork');
    doc.querySelector('[data-native-expand="e1"]').click();
    doc.querySelector('#study-expanded-pedal [data-native-action="add-vst"]').click();
    assert(win.testEvents.at(-1)[1].action === 'add-vst' && win.testEvents.at(-1)[1].effect === 'e1', 'Expanded pedal action');
    doc.querySelector('[data-study-close]').click();
    await new Promise(resolve => setTimeout(resolve, 0));
    await setView('board-2');
    assert(doc.querySelectorAll('#pedals .study-mini').length === 3, 'Moveable deck');
    doc.querySelector('.study-transport [data-native-action="record"]').click();
    assert(win.testEvents.at(-1)[1].action === 'record', 'Quick transport action');
    await setView('board-3');
    assert(doc.querySelectorAll('#pedals .looper').length === 1, 'Looper page');
    doc.querySelector('[data-study-page="pre"]').click();
    assert(doc.querySelector('#pedals [data-pedal]').dataset.pedal === 'e1', 'Pre page');
    doc.querySelector('[data-study-page="post"]').click();
    assert(doc.querySelector('#pedals [data-pedal]').dataset.pedal === 'e2', 'Post page');
    await setView('default');
    assert(doc.querySelectorAll('#pedals .pedal').length === 3 && win.localStorage.getItem('looper.visualView') === 'default', 'Return to default');
    result.textContent = 'PASS';
  } catch (error) {
    result.textContent = `FAIL: ${error.stack || error}`;
  }
}
run();
</script>
